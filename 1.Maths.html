<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATHS PRACTICE ENGINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@5.1.2/marked.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
  MathJax = { tex: { inlineMath: [['$','$'],['\\(','\\)']] }, svg: { fontCache:'global' }, startup: { ready() { MathJax.startup.defaultReady(); } } };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
[v-cloak]{display:none!important}
:root{
  --bg:#0a0a0f; --surface:#111118; --surface2:#18181f; --surface3:#1e1e28;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --text:#e8e8f0; --text2:#888899; --text3:#555566;
  --accent:#e8ff47; --accent2:#b8ff00;
  --red:#ff4757; --orange:#ff9f43; --yellow:#ffd32a; --green:#26de81; --blue:#45aaf2; --purple:#a29bfe;
  --font-display:'Bebas Neue',sans-serif; --font-mono:'DM Mono',monospace; --font-body:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  opacity:0.4;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(-8px);opacity:0}to{transform:translateX(0);opacity:1}}

.fade-up{animation:fadeUp 0.3s ease forwards}
.spin{animation:spin 1s linear infinite}
.view{position:relative;z-index:1;flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;animation:fadeUp 0.25s ease}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:52px;flex-shrink:0;
  border-bottom:1px solid var(--border);
  background:rgba(10,10,15,0.9);backdrop-filter:blur(12px);
  position:relative;z-index:10;
}
.topbar-brand{font-family:var(--font-display);font-size:22px;letter-spacing:2px;color:var(--accent)}
.topbar-nav{display:flex;gap:4px}
.topbar-btn{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:6px;border:none;cursor:pointer;
  background:transparent;color:var(--text2);font-family:var(--font-body);
  font-size:13px;transition:all 0.15s;
}
.topbar-btn:hover{background:var(--surface2);color:var(--text)}
.topbar-btn.active{background:var(--surface3);color:var(--accent)}
.topbar-btn svg{width:14px;height:14px}

.setup-view{overflow-y:auto;flex:1}
.setup-inner{max-width:900px;margin:0 auto;padding:40px 24px}
.setup-hero{margin-bottom:48px}
.setup-title{font-family:var(--font-display);font-size:clamp(48px,8vw,80px);line-height:0.95;color:var(--text);margin-bottom:16px}
.setup-title span{color:var(--accent)}
.setup-sub{color:var(--text2);font-size:15px;max-width:480px;line-height:1.6}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;transition:border-color 0.2s}
.card:hover{border-color:var(--border2)}
.card-label{font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-label::after{content:'';flex:1;height:1px;background:var(--border)}
.upload-zone{border:1px dashed var(--border2);border-radius:8px;padding:32px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.upload-zone:hover{border-color:var(--accent);background:rgba(232,255,71,0.03)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-zone-icon{font-size:32px;margin-bottom:12px}
.upload-zone-text{color:var(--text2);font-size:14px}
.upload-zone-text strong{color:var(--accent)}
.upload-count{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:rgba(38,222,129,0.1);color:var(--green);padding:6px 14px;border-radius:20px;font-family:var(--font-mono);font-size:13px}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.chapter-chip{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:13px;transition:all 0.15s;text-align:left;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chapter-chip:hover{border-color:var(--border2);color:var(--text)}
.chapter-chip.selected{border-color:var(--accent);background:rgba(232,255,71,0.08);color:var(--accent)}
.chapter-chip-count{font-family:var(--font-mono);font-size:10px;color:var(--text3);margin-top:2px}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.config-grid{grid-template-columns:1fr}}
.field-label{font-size:12px;color:var(--text2);margin-bottom:6px;font-family:var(--font-mono)}
.field-input,.field-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--font-body);font-size:14px;transition:border-color 0.15s;outline:none}
.field-input:focus,.field-select:focus{border-color:var(--accent)}
.field-select option{background:var(--surface2)}
.toggle-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface2);border-radius:8px;cursor:pointer}
.toggle-label{font-size:13px;color:var(--text2);flex:1}
.toggle-sub{font-size:11px;color:var(--text3);margin-top:1px}
.toggle-switch{width:36px;height:20px;border-radius:10px;background:var(--surface3);position:relative;transition:background 0.2s;flex-shrink:0}
.toggle-switch.on{background:var(--accent)}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:7px;background:#000;transition:transform 0.2s}
.toggle-switch.on::after{transform:translateX(16px)}
.start-btn{width:100%;margin-top:24px;padding:16px;border-radius:10px;background:var(--accent);color:#000;font-family:var(--font-display);font-size:22px;letter-spacing:2px;border:none;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden}
.start-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.start-btn:disabled{background:var(--surface3);color:var(--text3);cursor:not-allowed;transform:none}

.practice-view{display:flex;flex-direction:column;flex:1;overflow:hidden}
.practice-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:48px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);gap:16px;
}
.practice-progress{flex:1;display:flex;align-items:center;gap:12px}
.progress-track{flex:1;height:3px;background:var(--surface3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s}
.progress-label{font-family:var(--font-mono);font-size:12px;color:var(--text2);white-space:nowrap}
.timer-display{font-family:var(--font-mono);font-size:16px;font-weight:500}
.timer-display.warning{color:var(--red);animation:pulse 1s ease infinite}
.timer-display.ok{color:var(--green)}
.practice-body{flex:1;display:flex;overflow:hidden}
.question-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.question-image-area{flex:1;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.question-image-area img{max-width:100%;max-height:100%;object-fit:contain}
.q-label{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.7);color:var(--text2);font-family:var(--font-mono);font-size:11px;padding:4px 8px;border-radius:4px}
.chapter-badge{position:absolute;top:12px;right:12px;background:rgba(232,255,71,0.1);color:var(--accent);font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid rgba(232,255,71,0.2);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.question-footer{padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.answer-btns{display:flex;gap:6px}
.ans-btn{width:44px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-family:var(--font-mono);font-size:15px;font-weight:500;cursor:pointer;transition:all 0.15s}
.ans-btn:hover{border-color:var(--accent);color:var(--accent)}
.ans-btn.selected{background:var(--accent);border-color:var(--accent);color:#000}
.nav-btns{display:flex;gap:8px}
.nav-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:var(--font-body);font-size:13px;transition:all 0.15s;white-space:nowrap}
.nav-btn:hover{border-color:var(--border2);color:var(--text)}
.nav-btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:500}
.nav-btn.primary:hover{background:var(--accent2)}
.nav-btn.mark{border-color:var(--purple);color:var(--purple)}
.nav-btn.mark:hover{background:rgba(162,155,254,0.1)}
.nav-btn.marked{background:rgba(162,155,254,0.15);color:var(--purple);border-color:var(--purple)}
.mark-next-btn{padding:8px 16px;border-radius:8px;border:1px solid rgba(162,155,254,0.5);background:rgba(162,155,254,0.1);color:var(--purple);cursor:pointer;font-family:var(--font-body);font-size:13px;transition:all 0.15s;white-space:nowrap}
.mark-next-btn:hover{background:rgba(162,155,254,0.2)}
.end-btn{padding:8px 16px;border-radius:8px;background:rgba(255,71,87,0.1);color:var(--red);border:1px solid rgba(255,71,87,0.3);cursor:pointer;font-size:13px;transition:all 0.15s}
.end-btn:hover{background:rgba(255,71,87,0.2)}

.pause-btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;font-size:13px;font-family:var(--font-body);transition:all 0.15s;white-space:nowrap}
.pause-btn:hover{border-color:var(--accent);color:var(--accent)}
.pause-btn.paused{background:rgba(232,255,71,0.1);border-color:rgba(232,255,71,0.4);color:var(--accent)}
.pause-overlay{position:absolute;inset:0;background:rgba(10,10,15,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;backdrop-filter:blur(8px)}
.pause-overlay-icon{font-size:52px}
.pause-overlay-title{font-family:var(--font-display);font-size:36px;letter-spacing:3px;color:var(--text2)}
.pause-overlay-sub{font-family:var(--font-mono);font-size:12px;color:var(--text3)}
.pause-resume-btn{margin-top:8px;padding:12px 32px;border-radius:10px;background:var(--accent);color:#000;font-family:var(--font-display);font-size:20px;letter-spacing:2px;border:none;cursor:pointer;transition:all 0.15s}
.pause-resume-btn:hover{background:var(--accent2);transform:translateY(-1px)}

.q-elapsed{
  display:flex;align-items:center;gap:5px;
  font-family:var(--font-mono);font-size:13px;
  padding:6px 10px;border-radius:7px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text3);transition:color 0.3s,border-color 0.3s;
  flex-shrink:0;
}
.q-elapsed.t-fast{color:var(--green);border-color:rgba(38,222,129,0.3)}
.q-elapsed.t-warn{color:var(--yellow);border-color:rgba(255,211,42,0.3)}
.q-elapsed.t-slow{color:var(--red);border-color:rgba(255,71,87,0.3);animation:pulse 1.4s ease infinite}
.q-elapsed svg{width:11px;height:11px;opacity:0.6}

.pal-btn-inner{display:flex;flex-direction:column;align-items:center;gap:0px;line-height:1}
.pal-time{font-size:8px;color:var(--text3);font-family:var(--font-mono);margin-top:1px;line-height:1}
.palette-btn.t-fast .pal-time{color:var(--green)}
.palette-btn.t-warn .pal-time{color:var(--yellow)}
.palette-btn.t-slow .pal-time{color:var(--red)}

.time-chip{
  font-family:var(--font-mono);font-size:10px;
  padding:2px 7px;border-radius:4px;
  background:var(--surface3);color:var(--text3);
  flex-shrink:0;
}
.time-chip.t-fast{background:rgba(38,222,129,0.1);color:var(--green)}
.time-chip.t-warn{background:rgba(255,211,42,0.1);color:var(--yellow)}
.time-chip.t-slow{background:rgba(255,71,87,0.1);color:var(--red)}

.palette-panel{width:200px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.palette-header{padding:12px;border-bottom:1px solid var(--border);font-family:var(--font-mono);font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.palette-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;align-content:start}
.palette-btn{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text3);font-family:var(--font-mono);font-size:11px;cursor:pointer;transition:all 0.1s;position:relative;display:flex;align-items:center;justify-content:center}
.palette-btn:hover{border-color:var(--border2);color:var(--text2)}
.palette-btn.current{border-color:var(--accent)!important;color:var(--accent)!important}
.palette-btn.answered{background:rgba(38,222,129,0.15);border-color:rgba(38,222,129,0.3);color:var(--green)}
.palette-btn.visited{background:rgba(255,71,87,0.1);border-color:rgba(255,71,87,0.2);color:var(--red)}
.palette-btn.marked::after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--purple)}
.palette-legend{padding:10px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text3);font-family:var(--font-mono)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

.summary-view{display:flex;flex-direction:row;overflow:hidden;flex:1 1 0;min-height:0;height:100%}
.summary-sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);overflow:hidden;min-height:0}
.summary-score-block{padding:20px;border-bottom:1px solid var(--border);flex-shrink:0}
.score-big{font-family:var(--font-display);font-size:56px;line-height:1;margin-bottom:4px}
.score-big.good{color:var(--green)}
.score-big.ok{color:var(--yellow)}
.score-big.bad{color:var(--red)}
.score-sub{font-family:var(--font-mono);font-size:12px;color:var(--text2)}
.score-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.score-stat{background:var(--surface2);padding:10px;border-radius:8px}
.score-stat-val{font-family:var(--font-mono);font-size:18px;font-weight:500}
.score-stat-lbl{font-size:10px;color:var(--text3);margin-top:2px;font-family:var(--font-mono)}
.summary-filters{padding:12px;border-bottom:1px solid var(--border);display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
.filter-chip{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:11px;cursor:pointer;font-family:var(--font-mono);transition:all 0.15s}
.filter-chip:hover{border-color:var(--border2);color:var(--text)}
.filter-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(232,255,71,0.08)}
.summary-list{flex:1 1 0;min-height:0;overflow-y:auto;padding:8px}
.summary-item{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;transition:all 0.15s;display:flex;align-items:center;gap:10px}
.summary-item:hover{background:var(--surface2);border-color:var(--border)}
.summary-item.active{background:var(--surface3);border-color:var(--border2)}
.summary-item-thumb{width:44px;height:36px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--surface3);border:1px solid var(--border)}
.summary-item-q{font-family:var(--font-mono);font-size:12px;color:var(--text2)}
.summary-item-ch{font-size:10px;color:var(--text3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px}
.summary-badge{font-size:10px;font-family:var(--font-mono);padding:3px 8px;border-radius:10px;margin-left:auto;flex-shrink:0}
.badge-correct{background:rgba(38,222,129,0.15);color:var(--green)}
.badge-slow{background:rgba(255,211,42,0.15);color:var(--yellow)}
.badge-calc_error{background:rgba(255,159,67,0.15);color:var(--orange)}
.badge-concept_error{background:rgba(255,71,87,0.15);color:var(--red)}
.badge-unmarked{background:var(--surface3);color:var(--text3)}
.summary-sidebar-footer{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.new-session-btn{width:100%;padding:10px;border-radius:8px;background:var(--accent);color:#000;font-family:var(--font-display);font-size:16px;letter-spacing:1px;border:none;cursor:pointer;transition:all 0.15s}
.new-session-btn:hover{background:var(--accent2)}
.summary-main{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.summary-bottom{flex:0 0 280px;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-top:1px solid var(--border)}
.summary-controls{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;flex-wrap:wrap}
.answer-compare{display:flex;gap:16px;align-items:center}
.answer-block{display:flex;flex-direction:column}
.answer-block-lbl{font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-bottom:3px}
.answer-val{font-family:var(--font-mono);font-size:18px;font-weight:500;color:var(--blue)}
.answer-correct-val{display:flex;align-items:center;gap:6px}
.correct-badge-lg{width:28px;height:28px;border-radius:6px;background:var(--green);color:#000;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;font-weight:bold}
.edit-ans-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:2px;transition:color 0.15s}
.edit-ans-btn:hover{color:var(--accent)}
.edit-popover{position:relative}
.edit-dropdown{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:6px;display:flex;gap:4px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.edit-opt{width:28px;height:28px;border-radius:6px;background:var(--surface3);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-family:var(--font-mono);font-size:13px;transition:all 0.1s;display:flex;align-items:center;justify-content:center}
.edit-opt:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.result-btns{display:flex;gap:6px;flex-wrap:wrap}
.result-btn{padding:6px 12px;border-radius:6px;border:1px solid;cursor:pointer;font-size:12px;font-family:var(--font-mono);transition:all 0.15s;background:transparent}
.result-btn.concept{color:var(--red);border-color:rgba(255,71,87,0.4)}
.result-btn.concept:hover,.result-btn.concept.active{background:rgba(255,71,87,0.15)}
.result-btn.calc{color:var(--orange);border-color:rgba(255,159,67,0.4)}
.result-btn.calc:hover,.result-btn.calc.active{background:rgba(255,159,67,0.15)}

.login-badge{
  font-family:var(--font-mono);font-size:10px;letter-spacing:1px;
  padding:3px 10px;border-radius:20px;
  border:1px solid var(--border2);color:var(--text3);
}
.login-badge.a{border-color:rgba(232,255,71,0.3);color:var(--accent)}
.google-btn{
  display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--border2);
  border-radius:10px;padding:14px 28px;cursor:pointer;
  color:var(--text);font-family:var(--font-body);font-size:15px;font-weight:500;
  transition:all .2s;min-width:220px;justify-content:center;
}
.google-btn:hover{border-color:rgba(232,255,71,0.4);background:var(--surface2);transform:translateY(-1px)}
.google-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.google-btn svg{width:20px;height:20px;flex-shrink:0}
.login-err{color:var(--red);font-size:11px;font-family:var(--font-mono);margin-top:12px}
.login-user-bar{
  display:flex;align-items:center;gap:10px;
  margin-top:12px;padding:10px 16px;
  background:rgba(38,222,129,0.08);border:1px solid rgba(38,222,129,0.2);
  border-radius:8px;font-family:var(--font-mono);font-size:12px;color:var(--green);
}
.login-user-bar img{width:24px;height:24px;border-radius:50%}

/* Simple mobile layout: keep the question readable and put the question map below it. */
@media (max-width: 700px) {
  .practice-topbar {
    padding: 0 8px;
    gap: 6px;
    height: 44px;
  }
  .practice-progress { gap: 6px; min-width: 0; }
  .progress-label { font-size: 10px; }
  .pause-btn, .end-btn { padding: 6px 8px; font-size: 11px; }
  .practice-body {
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
  }
  .question-panel {
    flex: 0 0 auto;
    min-width: 0;
    overflow: visible;
  }
  .question-image-area {
    flex: 0 0 auto;
    height: auto;
    min-height: 0;
    padding: 18px 0 0;
  }
  .question-image-area img {
    display: block;
    width: auto;
    max-width: 100%;
    max-height: 42vh;
    object-fit: contain;
  }
  .q-label { top: 4px; left: 8px; }
  .question-footer {
    padding: 8px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ans-btn { width: 36px; height: 36px; }
  .nav-btns { gap: 4px; flex-wrap: wrap; }
  .nav-btn, .mark-next-btn { padding: 8px 9px; font-size: 11px; }
  .palette-panel {
    width: auto;
    min-width: 0;
    flex: 0 0 96px;
    border-left: 0;
    border-top: 1px solid var(--border);
  }
  .palette-header { padding: 5px 8px; font-size: 9px; }
  .palette-grid {
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 3px;
    padding: 4px 8px;
  }
  .palette-btn {
    aspect-ratio: auto;
    min-height: 24px;
    border-radius: 4px;
    font-size: 10px;
  }
  .palette-legend { display: none; }
}

</style>
</head>
<body>
<div id="app" v-cloak>

<div class="login-view" v-if="!cloudUser">
  <div class="login-inner">
    <div class="login-logo">PRACTICE<br><span>ENGINE</span></div>
    <div class="login-sub">Image-based SRS practice with AI solutions.<br>Sign in to sync your progress across devices.</div>
    <div class="login-badges">
      <span class="login-badge a">SRS Engine</span>
      <span class="login-badge a">Gemini AI</span>
      <span class="login-badge">SHA-256 Hashing</span>
      <span class="login-badge">Cloud Sync</span>
      <span class="login-badge">Problem Bank</span>
    </div>
    <template v-if="authChecked">
      <button class="google-btn" @click="signInGoogle" :disabled="authLoading">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        {{ authLoading ? 'Signing in…' : 'Continue with Google' }}
      </button>
      <div class="login-err" v-if="authError">{{ authError }}</div>
    </template>
    <template v-else>
      <div style="font-family:var(--font-mono);font-size:12px;color:var(--text3);animation:pulse 1.2s ease infinite">Checking session…</div>
    </template>
  </div>
</div>

<template v-if="cloudUser">

<div class="modal-overlay" v-if="showSettings" @click.self="showSettings=false">
  <div class="modal-box">
    <div class="modal-title">SETTINGS</div>
    <div class="modal-section">
      <div class="modal-section-title">Account</div>
      <div v-if="cloudUser" class="cloud-status">
        <div style="display:flex;align-items:center;gap:8px">
          <img v-if="cloudUser.photoURL" :src="cloudUser.photoURL" style="width:24px;height:24px;border-radius:50%;border:1px solid var(--border2)">
          <div class="cloud-user">{{ cloudUser.displayName || cloudUser.email }}</div>
        </div>
        <div class="cloud-actions">
          <button class="cloud-btn" @click="syncToCloud" :disabled="isSyncing">{{ isSyncing ? '⟳ Syncing…' : '↑ Sync Now' }}</button>
          <button class="cloud-btn" @click="signOut">Sign Out</button>
        </div>
      </div>
      <div v-if="lastSynced" style="font-size:11px;color:var(--text3);font-family:var(--font-mono);margin-top:4px">Last synced: {{ lastSynced }}</div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Gemini API Key</div>
      <input type="password" class="field-input" v-model="geminiKey" placeholder="AIza...">
      <div style="font-size:11px;color:var(--text3);margin-top:6px;font-family:var(--font-mono)">Used for AI solutions. Stored locally only.</div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Data Management</div>
      <div class="modal-row" style="margin-bottom:8px">
        <button class="modal-btn" @click="exportData">⬇ Export Backup</button>
        <label class="modal-btn" style="text-align:center;cursor:pointer">⬆ Import Backup<input type="file" accept=".json" @change="importData" style="display:none"></label>
      </div>
      <button class="modal-btn danger" style="width:100%" @click="confirmClear">✕ Clear All Data</button>
    </div>
    <button class="modal-save" @click="saveSettings">SAVE</button>
  </div>
</div>

<div class="modal-overlay" v-if="confirmDialog.show" @click.self="dismissConfirm">
  <div class="confirm-dialog">
    <div class="confirm-title">{{ confirmDialog.title }}</div>
    <div class="confirm-sub">{{ confirmDialog.message }}</div>
    <div class="confirm-btns">
      <button class="confirm-btn" @click="dismissConfirm">Cancel</button>
      <button class="confirm-btn confirm" @click="runConfirmAction">{{ confirmDialog.label }}</button>
    </div>
  </div>
</div>

<div class="topbar" v-if="view !== 'practice'">
  <span class="topbar-brand">MATHS PRACTICE</span>
  <div class="topbar-nav">
    <button class="topbar-btn" :class="{active: view==='setup'}" @click="navigateTo('setup')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      Setup
    </button>
    <button class="topbar-btn" :class="{active: view==='stats'}" @click="navigateTo('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
      Stats
    </button>
    <button class="topbar-btn" :class="{active: view==='problem_bank'}" @click="navigateTo('problem_bank')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Problem Bank
    </button>
    <button class="topbar-btn" @click="showSettings=true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </button>
    <button class="topbar-btn" @click="syncToCloud" :style="cloudUser ? 'color:var(--green)' : ''" :disabled="isSyncing" :title="cloudUser ? cloudUser.displayName || cloudUser.email : 'Not signed in'">
      <img v-if="cloudUser?.photoURL" :src="cloudUser.photoURL" style="width:16px;height:16px;border-radius:50%;margin-right:-2px">
      {{ isSyncing ? '⟳' : '⇅' }} {{ isSyncing ? 'Syncing…' : 'Sync' }}
    </button>
  </div>
</div>

<div class="view setup-view" v-if="view==='setup'">
  <div class="setup-inner">
    <div class="setup-hero fade-up">
      <div class="setup-title">PRACTICE<br><span>ENGINE</span></div>
      <div class="setup-sub">Image-based SRS practice with AI solutions. Built for deep retention.</div>
    </div>

    <div class="card fade-up" style="animation-delay:0.05s">
      <div class="card-label">01 — Load Question Bank</div>
      <label class="upload-zone" :style="isHashing ? 'pointer-events:none;opacity:0.6' : ''">
        <input type="file" webkitdirectory directory multiple @change="loadFiles" :disabled="isHashing">
        <template v-if="!isHashing">
          <div class="upload-zone-icon">📁</div>
          <div class="upload-zone-text">Drop a folder or <strong>click to browse</strong><br>
          Subfolders = chapters · No renaming needed</div>
        </template>
        <template v-else>
          <div style="font-size:28px;margin-bottom:10px">⚡</div>
          <div style="color:var(--accent);font-family:var(--font-mono);font-size:13px;margin-bottom:10px">Fingerprinting images... {{ hashProgress }}%</div>
          <div style="width:200px;height:3px;background:var(--surface3);border-radius:2px;margin:0 auto;overflow:hidden">
            <div :style="{width:hashProgress+'%',height:'100%',background:'var(--accent)',transition:'width 0.15s'}"></div>
          </div>
          <div style="color:var(--text3);font-size:11px;font-family:var(--font-mono);margin-top:10px">Rename files freely — identity tracked by full binary content</div>
        </template>
      </label>
      <div v-if="allFiles.length > 0 && !isHashing" style="text-align:center;margin-top:12px">
        <span class="upload-count">✓ {{ allFiles.length }} questions across {{ chapters.length }} chapters</span>
      </div>
    </div>

    <div class="card fade-up" v-if="chapters.length > 0" style="animation-delay:0.1s">
      <div class="card-label" style="cursor:default">
        02 — Select Chapters
        <button @click="toggleAll" style="background:none;border:none;color:var(--accent);font-size:11px;cursor:pointer;font-family:var(--font-mono);margin-left:8px">{{ selectedChapters.length === chapters.length ? 'NONE' : 'ALL' }}</button>
      </div>
      <div class="chapter-grid">
        <button v-for="ch in chapters" :key="ch" class="chapter-chip" :class="{selected: selectedChapters.includes(ch)}" @click="toggleChapter(ch)">
          {{ ch }}
          <div class="chapter-chip-count">{{ chapterCounts[ch] }} q</div>
        </button>
      </div>
    </div>

    <div class="card fade-up" v-if="selectedChapters.length > 0" style="animation-delay:0.15s">
      <div class="card-label">03 — Configure Session</div>
      <div class="config-grid">
        <div>
          <div class="field-label">Questions (max {{ availableCount }})</div>
          <input type="number" class="field-input" v-model.number="numQuestions" :max="availableCount" min="1">
        </div>
        <div>
          <div class="field-label">Mode</div>
          <select class="field-select" v-model="sessionMode">
            <option value="practice">Untimed Practice</option>
            <option value="timed">Timed Mock</option>
          </select>
        </div>
        <div v-if="sessionMode === 'timed'">
          <div class="field-label">Duration (minutes)</div>
          <input type="number" class="field-input" v-model.number="sessionDuration" min="5" max="180">
        </div>
        <div>
          <div class="field-label">Mix Strategy</div>
          <select class="field-select" v-model="mixStrategy">
            <option value="balanced">Balanced (75% New)</option>
            <option value="focus_new">Focus New (95% New)</option>
            <option value="focus_review">Focus Review (5% New)</option>
          </select>
        </div>
      </div>
      <div class="toggle-row" style="margin-top:12px" @click="reviewMode = !reviewMode">
        <div>
          <div class="toggle-label">Review Mode</div>
          <div class="toggle-sub">Only show mastered questions (3+ correct streaks)</div>
        </div>
        <div class="toggle-switch" :class="{on: reviewMode}"></div>
      </div>
      <button class="start-btn" :disabled="numQuestions < 1 || availableCount < 1 || isHashing" @click="startSession">START SESSION</button>
    </div>
  </div>
</div>

<div class="view practice-view" v-if="view==='practice' && currentQ">
  <div class="practice-topbar">
    <div class="practice-progress">
      <span class="progress-label" style="color:var(--text3);font-size:11px">Q{{ qIndex+1 }}/{{ session.length }}</span>
      <div class="progress-track"><div class="progress-fill" :style="{width: ((qIndex+1)/session.length*100)+'%'}"></div></div>
    </div>
    <span class="timer-display" :class="sessionMode==='timed' ? (timeLeft<300 ? 'warning' : 'ok') : ''" v-if="sessionMode==='timed'">{{ formattedTime }}</span>
    <button class="pause-btn" :class="{paused: isPaused}" @click="isPaused ? resumeSession() : pauseSession()">
      {{ isPaused ? '▶ Resume' : '⏸ Pause' }}
    </button>
    <button class="end-btn" @click="confirmEndSession">End Test</button>
  </div>

  <div class="practice-body">
    <div class="question-panel">
      <div class="question-image-area">
        <span class="q-label">Q{{ qIndex+1 }}</span>
        <img :src="currentQ.url" @error="e=>e.target.style.display='none'" :key="currentQ.id">
        <div class="pause-overlay" v-if="isPaused">
          <div class="pause-overlay-icon">⏸</div>
          <div class="pause-overlay-title">PAUSED</div>
          <div class="pause-overlay-sub">Session timer is paused · Question hidden</div>
          <button class="pause-resume-btn" @click="resumeSession">▶ RESUME</button>
        </div>
      </div>
      <div class="question-footer">
        <div class="answer-btns">
          <button v-for="opt in ['A','B','C','D']" :key="opt" class="ans-btn" :class="{selected: currentQ.userAnswer===opt}" @click="selectAnswer(opt)" :disabled="isPaused">{{ opt }}</button>
        </div>
        <div class="nav-btns">
          <button class="nav-btn" :class="{mark: !currentQ.markedForReview, marked: currentQ.markedForReview}" @click="toggleMark" :disabled="isPaused">
            {{ currentQ.markedForReview ? '★ Marked' : '☆ Mark' }}
          </button>
          <button class="mark-next-btn" @click="markAndNext" :disabled="isPaused">Mark &amp; Next</button>
          <button class="nav-btn primary" @click="nextQuestion" :disabled="isPaused">
            {{ qIndex === session.length-1 ? 'Finish →' : 'Next →' }}
          </button>
        </div>
      </div>
    </div>

    <div class="palette-panel">
      <div class="palette-header">Q Map</div>
      <div class="palette-grid">
        <button v-for="(q,i) in session" :key="i" class="palette-btn"
          :class="[{current:i===qIndex, answered:q.userAnswer, visited:q.visited&&!q.userAnswer, marked:q.markedForReview}]"
          @click="!isPaused && (qIndex=i)" :title="q.chapter + (q.timeSpent ? ' · ' + formatTime(q.timeSpent) : '')">
          <span>{{ i+1 }}</span>
        </button>
      </div>
      <div class="palette-legend">
        <div class="legend-item"><div class="legend-dot" style="background:rgba(38,222,129,0.5)"></div> Answered</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(255,71,87,0.4)"></div> Visited</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--purple)"></div> Marked</div>
        <div class="legend-item" style="margin-top:4px;padding-top:4px;border-top:1px solid var(--border)">
          <div style="display:flex;gap:4px;align-items:center">
            <span style="color:var(--green);font-size:9px">●</span><span style="color:var(--yellow);font-size:9px">●</span><span style="color:var(--red);font-size:9px">●</span>
          </div>
          Fast / Med / Slow
        </div>
      </div>
    </div>
  </div>
</div>

<div class="view summary-view" v-if="view==='summary'">
  <div class="summary-sidebar">
    <div class="summary-score-block">
      <div class="score-big" :class="accuracy>=75?'good':accuracy>=50?'ok':'bad'">{{ score }}<span style="font-size:28px;color:var(--text3)">/{{ markedCount }}</span></div>
      <div class="score-sub">{{ accuracy.toFixed(1) }}% accuracy (attempted only)</div>
      <div class="score-stats">
        <div class="score-stat"><div class="score-stat-val" style="color:var(--green)">{{ resultCounts.correct }}</div><div class="score-stat-lbl">✓ Correct</div></div>
        <div class="score-stat"><div class="score-stat-val" style="color:var(--yellow)">{{ resultCounts.slow }}</div><div class="score-stat-lbl">~ Slow</div></div>
        <div class="score-stat"><div class="score-stat-val" style="color:var(--orange)">{{ resultCounts.calc_error }}</div><div class="score-stat-lbl"># Calc Err</div></div>
        <div class="score-stat"><div class="score-stat-val" style="color:var(--red)">{{ resultCounts.concept_error }}</div><div class="score-stat-lbl">✗ Concept</div></div>
        <div class="score-stat" style="grid-column:1/-1" v-if="avgTime !== null">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="score-stat-val" :style="'color:'+(avgTime<=60?'var(--green)':avgTime<=90?'var(--yellow)':'var(--red)')">{{ formatTime(avgTime) }}</div>
            <div style="flex:1">
              <div class="score-stat-lbl">Avg Time / Question</div>
              <div style="display:flex;gap:3px;margin-top:4px">
                <div v-for="q in session" :key="q.id" :title="formatTime(q.timeSpent)" :style="'flex:1;height:4px;border-radius:2px;background:'+(q.timeSpent<=60?'var(--green)':q.timeSpent<=90?'var(--yellow)':'var(--red)')"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="summary-filters">
      <button v-for="f in summaryFilters" :key="f.val" class="filter-chip" :class="{active: summaryFilter===f.val}" @click="summaryFilter=f.val">{{ f.label }}</button>
    </div>

    <div class="summary-list">
      <div v-for="q in filteredSummary" :key="q.id" class="summary-item" :class="{active: activeSummaryQ?.id===q.id}" @click="setSummaryQ(q)">
        <img :src="q.url" class="summary-item-thumb" alt="" @error="e=>e.target.style.opacity='0.2'">
        <div style="min-width:0;flex:1">
          <div class="summary-item-q">Q{{ originalIndex(q)+1 }}</div>
          <div class="summary-item-ch">{{ q.chapter }}</div>
        </div>
        <span class="time-chip" :class="q.timeSpent > 0 ? palTimeClass(q.timeSpent) : ''" v-if="q.timeSpent > 0" style="margin-right:4px">{{ formatTime(q.timeSpent) }}</span>
        <span class="summary-badge" :class="'badge-'+(q.userMarking||'unmarked')">
          {{ q.userMarking ? {correct:'✓',slow:'~',calc_error:'#',concept_error:'✗'}[q.userMarking] : '—' }}
        </span>
      </div>
    </div>

    <div class="summary-sidebar-footer">
      <button class="new-session-btn" @click="goSetup">NEW SESSION</button>
    </div>
  </div>

  <div class="summary-main">
    <div v-if="!activeSummaryQ" style="flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);gap:10px;background:var(--bg)">
      <div style="font-size:40px">👈</div>
      <div style="font-family:var(--font-mono);font-size:12px">Select a question from the list to review</div>
    </div>

    <template v-if="activeSummaryQ">
      <div style="flex:1 1 0;min-height:0;width:100%;background:#050508;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative">
        <img :src="activeSummaryQ.url" :key="activeSummaryQ.id" style="max-width:100%;max-height:100%;object-fit:contain;display:block" @error="e=>{e.target.style.opacity='0.15'}" @load="e=>e.target.style.opacity='1'">
        <div v-if="!activeSummaryQ.url" style="position:absolute;color:var(--text3);font-family:var(--font-mono);font-size:12px">No image</div>

<script>
const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;

const WEAK_THRESHOLD  = 75;
const MASTERED_STREAK = 3;
const CORRECT_INTERVALS = [10, 20, 35, 60, 90];
const SLOW_INTERVALS    = [3, 10, 20, 35, 60];

function makeEntry(chapter) {
  return {
    chapter, times_practiced:0, times_wrong:0, times_slow:0,
    correct_streak:0, fast_correct_streak:0,
    correctAnswer:null, last_practiced:null, next_due:null,
    solution:null, events:[]
  };
}

function today() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().split('T')[0];
}
function addDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().split('T')[0];
}

function recompute(entry) {
  let cStreak=0, fStreak=0, wrong=0, slow=0;
  for (const ev of (entry.events || [])) {
    if (ev.result==='correct')      { cStreak++; fStreak++; }
    else if (ev.result==='slow')    { cStreak++; fStreak=0; slow++; }
    else                            { cStreak=0; fStreak=0; wrong++; }
  }
  entry.correct_streak      = Math.max(0, cStreak);
  entry.fast_correct_streak = Math.max(0, fStreak);
  entry.times_wrong         = wrong;
  entry.times_slow          = slow;
  entry.times_practiced     = (entry.events || []).length;
  return entry;
}

// ── FIX 1: ANTI-LEITNER INTERVAL RESET ──
const WRONG_INTERVALS = [1, 3, 7, 14, 30, 45, 90];

function setNextDue(entry, result) {
  if (result === 'correct') {
    const idx = Math.min(entry.correct_streak - 1, CORRECT_INTERVALS.length - 1);
    entry.next_due = addDays(CORRECT_INTERVALS[Math.max(0, idx)]);
  } else if (result === 'slow') {
    const idx = Math.min(entry.correct_streak - 1, SLOW_INTERVALS.length - 1);
    entry.next_due = addDays(SLOW_INTERVALS[Math.max(0, idx)]);
  } else {
    const idx = Math.min(entry.times_wrong - 1, WRONG_INTERVALS.length - 1);
    entry.next_due = addDays(WRONG_INTERVALS[Math.max(0, idx)]);
  }
}

    const hashFile = async (file) => {

      const digest = await crypto.subtle.digest('SHA-256', buf);

      for (const file of e.target.files) {

      const files = new Array(rawFiles.length);

    const toggleChapter = (ch) => {
      const idx = selectedChapters.value.indexOf(ch);
      if (idx >= 0) selectedChapters.value.splice(idx, 1);
      else selectedChapters.value.push(ch);
    };

    const toggleAll = () => {
      selectedChapters.value = selectedChapters.value.length === chapters.value.length
        ? [] : [...chapters.value];
    };

    // ── FIX 8: STRICT REVIEW MODE FILTERING ──
    const weightedSelect = (pool, n) => {
      const hist  = history.value;
      const td    = today();
      
      if (reviewMode.value) {
        const masteredQs = pool.filter(f => hist[f.id]?.correct_streak >= MASTERED_STREAK);
        return shuffle(masteredQs).slice(0, n);
      }

      const ratio = mixStrategy.value==='focus_new' ? 0.95
                  : mixStrategy.value==='focus_review' ? 0.05 : 0.75;
      const freshQs = pool.filter(f => !hist[f.id]);
      const dueQs   = pool.filter(f => {
        const h = hist[f.id];
        if (!h || h.last_practiced===td) return false;
        if (h.correct_streak >= MASTERED_STREAK) return false;
        return !h.next_due || h.next_due <= td;
      });
      const wantNew = Math.ceil(n * ratio);
      const wantOld = n - wantNew;
      let chosen = [...shuffle(freshQs).slice(0,wantNew), ...shuffle(dueQs).slice(0,wantOld)];
      if (chosen.length < n) {
        const already = new Set(chosen.map(f=>f.id));
        chosen = [...chosen, ...shuffle(pool.filter(f => {
          if (already.has(f.id)) return false;
          if (hist[f.id]?.last_practiced === td) return false;
          return hist[f.id]?.correct_streak < MASTERED_STREAK;
        })).slice(0, n-chosen.length)];
      }
      return shuffle(chosen).slice(0,n);
    };

    const startSession = () => {
      const pool   = allFiles.value.filter(f => selectedChapters.value.includes(f.chapter));
      const picked = weightedSelect(pool, numQuestions.value);
      if (!picked.length) return alert('No questions matched criteria.');

      session.value = picked.map(q => ({
        ...q,
        correctAnswer:   history.value[q.id]?.correctAnswer || null,
        solution:        history.value[q.id]?.solution      || null,
        userAnswer:      null,
        userMarking:     null,
        markedForReview: false,
        visited:         false,
        timeSpent:       0,
      }));

      qIndex.value  = 0;
      isPaused.value = false;
      view.value    = 'practice';
      saveSessionState();
      startTick();

      if (sessionMode.value==='timed') {
        timeLeft.value = sessionDuration.value * 60;
        startTimer();
      }
    };

    const startTimer = () => {
      clearInterval(timerHandle);
      timerHandle = setInterval(() => {
        timeLeft.value--;
        if (timeLeft.value <= 0) { clearInterval(timerHandle); endSession(); }
        saveSessionState();
      }, 1000);
    };

    const selectAnswer = (opt) => {
      if (!currentQ.value || isPaused.value) return;
      currentQ.value.userAnswer = opt;
      currentQ.value.visited    = true;
      saveSessionState();
    };

    const toggleMark = () => {
      if (!currentQ.value || isPaused.value) return;
      currentQ.value.markedForReview = !currentQ.value.markedForReview;
      saveSessionState();
    };

    const markAndNext = () => {
      if (!currentQ.value || isPaused.value) return;
      currentQ.value.markedForReview = true;
      currentQ.value.visited = true;
      if (qIndex.value < session.value.length-1) qIndex.value++;
      else endSession();
      saveSessionState();
    };

    const nextQuestion = () => {
      if (!currentQ.value || isPaused.value) return;
      currentQ.value.visited = true;
      if (qIndex.value < session.value.length-1) qIndex.value++;
      else confirmEndSession();
      saveSessionState();
    };

    const confirmEndSession = () => {
      showConfirm('Finish Test?', 'All unanswered questions will remain unmarked.', 'Submit', endSession);
    };

    const endSession = () => {
      if (qStartTime.value !== null && session.value[qIndex.value]) {
        const elapsed = Math.round((Date.now() - qStartTime.value) / 1000);
        session.value[qIndex.value].timeSpent = (session.value[qIndex.value].timeSpent || 0) + elapsed;
      }
      stopTick();
      isPaused.value = false;
      clearInterval(timerHandle);
      localStorage.removeItem('pe_session');
      view.value = 'summary';
      activeSummaryQ.value = null;
      summaryFilter.value  = 'all';
      if (cloudUser.value) syncToCloud();
    };

    // ── FIX 6 & 7: SAME-DAY MASTERY & MIDNIGHT FREEZE PRESERVATION ──
    const markResult = (question, newResult) => {
      if (!question) return;
      const oldResult = question.userMarking;
      question.userMarking = newResult;

      const sessionQ = session.value.find(q => q.id === question.id);
      if (sessionQ) sessionQ.userMarking = newResult;

      let entry = history.value[question.id];
      if (!entry) entry = makeEntry(question.chapter);

      const td        = today();
      const lastEvent = entry.events[entry.events.length-1];
      const isSameDayRemark = lastEvent && lastEvent.date === td;
      const isSessionRemark = oldResult !== undefined && oldResult !== null;

      if (isSameDayRemark || isSessionRemark) {
        if (lastEvent) {
          lastEvent.date   = td;
          lastEvent.result = newResult;
          lastEvent.t      = sessionQ?.timeSpent || lastEvent.t || 0;
        } else {
          entry.events.push({ date:td, result:newResult, t: sessionQ?.timeSpent||0 });
        }
      } else {
        entry.events.push({ date:td, result:newResult, t: sessionQ?.timeSpent||0 });
      }

      entry.last_practiced = td;
      recompute(entry);
      setNextDue(entry, newResult);
      history.value[question.id] = entry;
      saveHistory();

      if (history.value[question.id]?.correctAnswer) {
        question.correctAnswer = history.value[question.id].correctAnswer;
        if (sessionQ) sessionQ.correctAnswer = question.correctAnswer;
      }

      if (view.value==='summary' && !isSessionRemark) {
        const filtered = filteredSummary.value;
        const idx = filtered.findIndex(q => q.id === question.id);
        if (idx !== -1 && idx < filtered.length - 1) setSummaryQ(filtered[idx + 1]);
      }

      if (view.value==='problem_bank' && activePBQ.value?.id===question.id) {
        const h = history.value[question.id];
        const stillInBank = pbFilter.value==='wrong'
          ? (h.times_wrong >= pbThreshold.value && h.correct_streak === 0)
          : (h.times_slow  >= pbThreshold.value && h.fast_correct_streak === 0);
        if (!stillInBank) activePBQ.value = null;
      }
    };

    const saveAnswer = (question, opt) => {
      question.correctAnswer = opt;
      if (!history.value[question.id]) history.value[question.id] = makeEntry(question.chapter);
      history.value[question.id].correctAnswer = opt;
      const sessionQ = session.value.find(q => q.id === question.id);
      if (sessionQ) sessionQ.correctAnswer = opt;
      if (activePBQ.value?.id === question.id) activePBQ.value.correctAnswer = opt;
      saveHistory();
      editingAnswer.value = false;
    };

    // ── FIX 12: SAFE MATHJAX ASYNC RENDERING ──
    const generateSolution = async (question) => {
      if (!geminiKey.value) return alert('Set your Gemini API key in Settings first.');
      if (!question.file)   return alert('Question file not available in this session.');
      if (question.solution && !confirm('Regenerate solution?')) return;
      aiLoading.value = true;
      aiError.value   = null;
      try {
        const base64 = await fileToBase64(question.file);
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey.value}`,
          { method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ contents:[{ parts:[{text:AI_PROMPT},{inlineData:{mimeType:question.file.type,data:base64}}] }] }) }
        );
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        if (!data.candidates?.length) throw new Error('No response from Gemini — check your API key or try again.');
        const candidate = data.candidates[0];
        if (candidate.finishReason && candidate.finishReason !== 'STOP' && candidate.finishReason !== 'MAX_TOKENS') {
          throw new Error(`Gemini blocked the response (${candidate.finishReason}). Try a different question.`);
        }
        if (!candidate.content?.parts?.[0]?.text) {
          throw new Error('Gemini returned an empty response. Try again.');
        }
        const text = candidate.content.parts[0].text;
        question.solution = text;
        if (activePBQ.value?.id === question.id) activePBQ.value.solution = text;
        if (!history.value[question.id]) history.value[question.id] = makeEntry(question.chapter);
        history.value[question.id].solution = text;
        try {
          const clean = text.replace(/```json\s*|\s*```/g,'').trim();
          const match = clean.match(/\{[\s\S]*\}/);
          if (match) {
            const parsed = JSON.parse(match[0]);
            const opt = (parsed.correctOption||'').toUpperCase();
            if (['A','B','C','D'].includes(opt)) {
              question.correctAnswer = opt;
              history.value[question.id].correctAnswer = opt;
              if (activePBQ.value?.id === question.id) activePBQ.value.correctAnswer = opt;
            }
          }
        } catch {}
        saveHistory();
        nextTick(() => {
          if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax rendering error:', err));
          }
        });
      } catch(e) {
        aiError.value = e.message;
      } finally {
        aiLoading.value = false;
      }
    };

    const fileToBase64 = file => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = () => res(r.result.split(',')[1]);
      r.onerror = () => rej(new Error('File read failed'));
      r.readAsDataURL(file);
    });

    const escapeHtml = (str) => {
      if (typeof str !== 'string') return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    };

    const renderSolution = (text) => {
      if (!text) return '';
      try {
        const clean = text.replace(/```json\s*|\s*```/g,'').trim();
        const match = clean.match(/\{[\s\S]*\}/);
        if (!match) return `<div class="sol-raw">${marked.parse(text)}</div>`;
        const d = JSON.parse(match[0]);
        let html = '<div class="sol-body">';
        if (d.steps?.length) {
          html += '<div class="sol-steps">';
          d.steps.forEach((s,i) => {
            html += `<div class="sol-step"><span class="sol-num">${i+1}</span><div class="sol-text">${escapeHtml(s)}</div></div>`;
          });
          html += '</div>';
        }
        if (d.sscShortcut && d.sscShortcut !== 'null' && d.sscShortcut !== null) {
          html += `<div class="sol-shortcut"><div class="sol-shortcut-label">⚡ Shortcut</div><div class="sol-shortcut-text">${escapeHtml(d.sscShortcut)}</div></div>`;
        }
        if (d.finalAnswer) {
          html += `<div class="sol-answer"><div class="sol-answer-val">${escapeHtml(d.finalAnswer)}</div><div class="sol-answer-opt">${d.correctOption ? 'Option '+escapeHtml(d.correctOption) : ''}</div></div>`;
        }
        if (d.commonTrap && d.commonTrap !== 'null' && d.commonTrap !== null) {
          html += `<div class="sol-trap"><div class="sol-trap-text">⚠ ${escapeHtml(d.commonTrap)}</div></div>`;
        }
        html += '</div>';
        return html;
      } catch {
        return `<div class="sol-raw">${marked.parse(text)}</div>`;
      }
    };

    const setSummaryQ = (q) => {
      const liveFile  = allFiles.value.find(f => f.id === q.id);
      const histEntry = history.value[q.id];
      const correctAnswer = q.correctAnswer || histEntry?.correctAnswer || null;
      const solution      = q.solution      || histEntry?.solution      || null;
      activeSummaryQ.value = liveFile
        ? { ...q, url: liveFile.url, file: liveFile.file, correctAnswer, solution }
        : { ...q, correctAnswer, solution };
      editingAnswer.value  = false;
      aiError.value        = null;
      if (solution) {
        nextTick(() => {
          if (window.MathJax && window.MathJax.typesetPromise) {
            MathJax.typesetPromise().catch(err => console.warn('MathJax rendering error:', err));
          }
        });
      }
    };

    const setPBQ = (q) => {
      const fileRef = allFiles.value.find(f => f.id===q.id);
      activePBQ.value = fileRef ? {...q, file:fileRef.file, url:fileRef.url} : q;
      editingAnswer.value = false;
      aiError.value       = null;
    };

    const originalIndex = (q) => session.value.findIndex(s => s.id===q.id);

    const goSetup = () => {
      clearInterval(timerHandle);
      stopTick();
      isPaused.value       = false;
      session.value        = [];
      activeSummaryQ.value = null;
      view.value           = 'setup';
    };

    const navigateTo = (target) => {
      if (view.value === 'summary') {
        showConfirm('Leave Review?', 'Your session results will be lost if you navigate away.', 'Leave', () => {
          session.value        = [];
          activeSummaryQ.value = null;
          view.value           = target;
        });
        return;
      }
      view.value = target;
    };

    const saveHistory = () => {
      try {
        const stripped = {};
        for (const [id, entry] of Object.entries(history.value)) {
          stripped[id] = { ...entry, solution: null };
        }
        localStorage.setItem('pe_history', JSON.stringify(stripped));
      } catch(e) {
        if (e.name === 'QuotaExceededError') {
          alert('Local storage full! Your SRS data is safe in the cloud. Use Settings → Export Backup or clear old data.');
        }
      }
    };

    const saveSessionState = () => {
      try {
        localStorage.setItem('pe_session', JSON.stringify({
          questions:   session.value.map(q => ({...q, file:null, url:null})),
          qIndex:      qIndex.value,
          sessionMode: sessionMode.value,
          timeLeft:    timeLeft.value,
          ts:          Date.now()
        }));
      } catch {}
    };

    const tryRestoreSession = () => {
      try {
        const raw = localStorage.getItem('pe_session');
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (Date.now() - saved.ts > 2*60*60*1000) { localStorage.removeItem('pe_session'); return; }
        if (!confirm('Resume interrupted session?')) { localStorage.removeItem('pe_session'); return; }
        const restored = saved.questions.map(sq => {
          const f = allFiles.value.find(f => f.id === sq.id);
          if (!f) return null;
          return { ...sq, chapter: f.chapter, file: f.file, url: f.url, timeSpent: sq.timeSpent || 0 };
        }).filter(Boolean);
        if (restored.length > 0) {
          session.value    = restored;
          qIndex.value     = saved.qIndex;
          sessionMode.value= saved.sessionMode;
          timeLeft.value   = saved.timeLeft;
          view.value       = 'practice';
          isPaused.value   = false;
          startTick();
          if (saved.sessionMode==='timed') startTimer();
        } else {
          localStorage.removeItem('pe_session');
        }
      } catch { localStorage.removeItem('pe_session'); }
    };

    watch(allFiles, v => { if (v.length > 0) tryRestoreSession(); });
    watch(() => availableCount.value, newMax => {
      if (numQuestions.value > newMax) numQuestions.value = newMax;
    });

    const initFirebase = () => {
      try {
        if (typeof firebase === 'undefined') { authChecked.value = true; return; }
        if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
        firebase.auth().onAuthStateChanged(u => {
          cloudUser.value = u;
          authChecked.value = true;
          authLoading.value = false;
          if (u) loadFromCloud();
        });
      } catch(e) {
        console.warn('[Firebase] Init failed:', e.message);
        authChecked.value = true;
      }
    };

    const signInGoogle = async () => {
      authLoading.value = true;
      authError.value   = '';
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await firebase.auth().signInWithPopup(provider);
      } catch(e) {
        authError.value   = e.message;
        authLoading.value = false;
      }
    };

    const signOut = async () => {
      if (!confirm('Sign out? Your data is saved in the cloud.')) return;
      await firebase.auth().signOut();
      cloudUser.value   = null;
      authChecked.value = true;
    };

    const syncToCloud = async () => {
      if (!cloudUser.value) return;
      isSyncing.value = true;
      try {
        const historyToSync = {};
        for (const [id, entry] of Object.entries(history.value)) {
          historyToSync[id] = { ...entry, solution: null };
        }
        await firebase.firestore().collection('userData').doc(cloudUser.value.uid).set({
          history: historyToSync,
          updated: new Date().toISOString()
        });
        lastSynced.value = new Date().toLocaleTimeString();
      } catch(e) { alert('Sync failed: '+e.message); }
      finally { isSyncing.value = false; }
    };

    // ── FIX 10: MULTI-DEVICE UNION CLOUD SYNC ──
    const loadFromCloud = async () => {
      try {
        const doc = await firebase.firestore().collection('userData').doc(cloudUser.value.uid).get();
        if (!doc.exists) return;
        const data = doc.data();
        if (data.history) {
          const merged = { ...data.history };
          for (const [id, localEntry] of Object.entries(history.value)) {
            const cloudEntry = merged[id];
            if (!cloudEntry) {
              merged[id] = localEntry;
            } else {
              const eventMap = new Map();
              for (const ev of (cloudEntry.events || [])) eventMap.set(`${ev.date}|${ev.result}|${ev.t}`, ev);
              for (const ev of (localEntry.events || [])) eventMap.set(`${ev.date}|${ev.result}|${ev.t}`, ev);
              
              const mergedEvents = Array.from(eventMap.values()).sort((a,b) => a.date.localeCompare(b.date));
              cloudEntry.events = mergedEvents;
              recompute(cloudEntry);
              
              const localDate = localEntry.last_practiced || '';
              const cloudDate = cloudEntry.last_practiced || '';
              cloudEntry.last_practiced = localDate >= cloudDate ? localDate : cloudDate;
              if (localEntry.next_due && (!cloudEntry.next_due || localEntry.next_due < cloudEntry.next_due)) {
                cloudEntry.next_due = localEntry.next_due;
              }
              merged[id] = cloudEntry;
            }
          }
          history.value = merged;
          saveHistory();
        }
        lastSynced.value = data.updated ? new Date(data.updated).toLocaleTimeString() : '';
      } catch(e) { console.warn('[Firebase] Load failed:', e.message); }
    };

    const saveSettings = () => {
      localStorage.setItem('pe_gemini_key', geminiKey.value);
      showSettings.value = false;
    };

    const exportData = () => {
      const blob = new Blob([JSON.stringify({history:history.value}, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `practice_backup_${today()}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    const importData = (e) => {
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (d.history) { history.value = {...history.value, ...d.history}; saveHistory(); }
          alert(`Import successful! ${d.history ? Object.keys(d.history).length : 0} questions loaded.`);
        } catch { alert('Invalid backup file.'); }
      };
      reader.readAsText(e.target.files[0]);
    };

    const confirmClear = () => showConfirm('Clear All Data?', 'This will erase all history and stats permanently.', 'Clear', () => {
      localStorage.clear(); location.reload();
    });

    const showConfirm = (title, message, label, action) => {
      if (view.value === 'practice' && !isPaused.value && qStartTime.value !== null) {
        const elapsed = Math.round((Date.now() - qStartTime.value) / 1000);
        if (session.value[qIndex.value]) {
          session.value[qIndex.value].timeSpent = (session.value[qIndex.value].timeSpent || 0) + elapsed;
        }
        qStartTime.value = null;
        clearInterval(timerHandle);
      }
      confirmAction.value = action;
      confirmDialog.value = { show: true, title, message, label };
    };

    const dismissConfirm = () => {
      confirmDialog.value.show = false;
      if (view.value === 'practice' && !isPaused.value) {
        qStartTime.value = Date.now();
        if (sessionMode.value === 'timed' && timeLeft.value > 0) startTimer();
      }
    };

    const runConfirmAction = () => {
      confirmDialog.value.show = false;
      confirmAction.value();
    };

    onMounted(() => {
      try {
        const raw = JSON.parse(localStorage.getItem('pe_history'));
        if (raw) history.value = raw;
      } catch { history.value = {}; }
      geminiKey.value = localStorage.getItem('pe_gemini_key') || '';
      initFirebase();
    });

    return {
      view, allFiles, chapters, selectedChapters, numQuestions, sessionMode, sessionDuration, mixStrategy, reviewMode,
      chapterCounts, availableCount, session, qIndex, currentQ, formattedTime, timeLeft,
      activeSummaryQ, summaryFilter, summaryFilters, filteredSummary, editingAnswer,
      pbFilter, pbThreshold, activePBQ, problemBank,
      srsHealth, svgTrendPath, heatmapGrid, speedByChapter, repeatOffenders,
      aiLoading, aiError, showSettings, geminiKey,
      cloudUser, isSyncing, lastSynced, authChecked, authLoading, authError,
      markedCount, score, accuracy, resultCounts, resultTypes,
      chapterStats, overviewStats, dueToday, errorBreakdown,
      confirmDialog, isHashing, hashProgress,
      isPaused, pauseSession, resumeSession,
      liveElapsed, elapsedClass, avgTime, formatTime, palTimeClass,
      loadFiles, toggleChapter, toggleAll, startSession,
      selectAnswer, toggleMark, markAndNext, nextQuestion, confirmEndSession, endSession,
      markResult, saveAnswer, generateSolution, renderSolution,
      setSummaryQ, setPBQ, originalIndex, goSetup, navigateTo,
      saveSettings, exportData, importData, confirmClear,
      dismissConfirm, runConfirmAction,
      signInGoogle, signOut, syncToCloud,
    };
  }
}).mount('#app');
</script>
</body>
</html>
